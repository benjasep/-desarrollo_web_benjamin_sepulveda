<!DOCTYPE html>
<html lang="es">
  <head>
    <title>formulario aviso de adopciones</title>
    <link rel="stylesheet" type="text/css" href="../css/forms.css">
  </head>
  <body>
    <h1>formulario aviso de adopciones</h1>
    <a href="./portada.html">Volver a la pagina principal</a>
    <div class="main-container">
        <div id="val-box" hidden>
            <h2 id="val-msg"></h2>
            <ul id="val-list"></ul>
        </div>

      <form class="formulario" id="login-form">
        <div id="region-input" class="grupo-input">
          <label for="region">Region</label>
          <select id="region"> 
            <option value="" id="default-region">Seleccione una region</option>
          </select>
        </div>
 
        <div id="comuna-input" class="grupo-input">
          <label for="comuna">Comuna</label>
          <select id="comuna"> 
            <option value="" id="defult-comuna">Seleccione una comuna</option>
          </select>
        </div>

        <div id="sector-input" class="grupo-input">
          <label for="sector">Sector</label>
          <input id="sector" name="sector" type="text">
        </div>

        <div id="name-input" class="grupo-input">
          <label for="username">Nombre</label>
          <input id="username" name="username" type="text">
        </div>

        <div id="mail-input" class="grupo-input">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required>
        </div>

        <div id="celular-input" class="grupo-input">
          <label for="celular">numero celular</label>
          <input id="celular" name="celular" type="tel"  placeholder="+56912345678" required>
        </div>

        <div id="contacto-input" class="grupo-input">
          <label for="contacto">Tipo de contacto</label>
          <select id="contacto">
            <option value="" id="defult-contacto">Seleccione una red social</option>
          </select>

          <label for="url-contacto" hidden>url o link del contacto</label>
          <input type="text" id="url-contacto" name="url-contacto" hidden>
        </div>

        <div id="tipo-input" class="grupo-input">
          <p>Que animal es?</p>
          <input type="radio" id="perro" name="animal" value="perro">
          <label for="perro">perro</label>
          <input type="radio" id="gato" name="animal" value="gato">
          <label for="gato">gato</label>
        </div>

        <div id="cantidad-input" class="grupo-input">
          <label for="cantidad">Cantidad</label>
          <input id="cantidad" name="cantidad" type="number" min="1">
        </div>

        <div id="edad-input" class="grupo-input">
          <label for="edad">Edad</label>
          <input id="edad" name="edad" type="number" min="1">
        </div>

        <div id="medida-input" class="grupo-input">
          <p>Meses o anios?</p>
          <input type="radio" id="meses" name="tiempo-animal" value="meses">
          <label for="meses">meses</label>
          <input type="radio" id="anios" name="tiempo-animal" value="anios">
          <label for="anios">anios</label>
        </div>
      <hr>

        <div id="fecha-input" class="grupo-input">
          <label for="fecha">Indique hora y fecha de entrega, los limites de tiempo para entrega:<br><br>
          Inicio: 02-09-2025 a las 8:00 hrs<br><br>
          Termino: 02-09-2025 a las 11:00 hrs
          </label>
          <input id="fecha" name="fecha" type="datetime-local" value="2025-09-02T08:00:00">
        </div>

        <div id="descripcion-input" class="grupo-input">
          <label for="descripcion">Descripcion</label>
          <textarea id="descripcion" name="descripcion"></textarea>
        </div>

        <div id="foto-input" class="grupo-input">
          <p>Foto(s) (minima 1)</p>
          <ul>
            <li>
              <input id="foto1" name="foto1" type="file">
            </li>
            <li id="lifoto2" hidden>
              <input id="foto2" name="foto2" type="file">
            </li>
            <li id="lifoto3" hidden>
              <input id="foto3" name="foto3" type="file">
            </li>
            <li id="lifoto4" hidden>
              <input id="foto4" name="foto4" type="file">
            </li>
            <li id="lifoto5" hidden>
              <input id="foto5" name="foto5" type="file">
            </li>
          </ul>
        </div> 

        <div class="botones">
          <button type="button" id="envio">
            mandar formulario
          </button>
        </div>

      </form>
    </div>
    <script lang="javascript" src="../javascript/region_comuna.js"></script>
    <script lang="javascript" src="../javascript/comunasSelector.js"></script>
    <script lang="javascript" src="../javascript/validaciones.js"></script>
  </body>
</html>
